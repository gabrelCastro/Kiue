name: CI

# Roda o mesmo que `npm run check` a cada push e pull request:
# tipos (jogo e servidor), testes unitários, build (com a checagem de vazamento do bundle) e e2e.
on:
  push:
    branches: [master]
  pull_request:

# um push novo cancela a execução anterior da mesma branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_NO_WARNINGS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Navegador dos testes e2e
        run: npx playwright install --with-deps chromium

      - name: Tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Testes e2e
        run: npx playwright test

      - name: Relatório dos e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
