<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // modo claro/noturno antes da primeira pintura: escolha salva, senão o do sistema
      try {
        var m = localStorage.getItem('kiue:theme');
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = m;
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kiuê" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- imagem parada da vitrine da tela inicial: chega junto com o JS, não depois dele -->
    <link rel="preload" as="image" href="hero-poster.webp" type="image/webp" fetchpriority="high" media="(prefers-color-scheme: light)" />
    <link rel="preload" as="image" href="hero-poster-dark.webp" type="image/webp" fetchpriority="high" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Kiuê</title>
    <meta name="description" content="Jogo 3D para aprender filas, tópicos e mensageria" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e1117'/><rect x='3' y='12' width='8' height='8' rx='1' fill='%23ff7a59'/><rect x='12' y='12' width='8' height='8' rx='1' fill='%23ffc531'/><rect x='21' y='12' width='8' height='8' rx='1' fill='%234f7bff'/></svg>" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
